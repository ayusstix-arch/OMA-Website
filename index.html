<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0a1017"
    >

    <title>OMA - AI Assistant</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="bootstrap icons/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         OMA CSS
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #080d12;

            color: #ffffff;

            overflow: hidden;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;
        }


        button,
        input,
        textarea {
            font-family: inherit;
        }


        /* =================================================
           APP
        ================================================= */

        .oma-app {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            min-height: 0;

            display: flex;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(52, 127, 189, 0.07),
                    transparent 35%
                ),
                #0a1017;
        }


        /* =================================================
           SIDEBAR
        ================================================= */

        .history-sidebar {
            width: 285px;
            height: 100vh;
            height: 100dvh;

            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            background:
                rgba(17, 24, 32, 0.98);

            border-right:
                1px solid #27333f;

            z-index: 2000;

            backdrop-filter: blur(15px);
        }


        .sidebar-header {
            height: 72px;

            padding: 12px 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid #27333f;
        }


        .sidebar-brand {
            display: flex;
            align-items: center;

            gap: 10px;

            font-size: 18px;
        }


        .small-logo {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            overflow: hidden;

            background: #1d2833;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid #344451;
        }


        .small-logo img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        .sidebar-icon-button {
            width: 36px;
            height: 36px;

            border: none;

            border-radius: 9px;

            background: transparent;

            color: #9aa7b3;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .sidebar-icon-button:hover {
            background: #202c36;

            color: white;
        }


        /* =================================================
           NEW CHAT
        ================================================= */

        .new-chat-button {
            margin: 15px;

            padding: 12px;

            border:
                1px solid #35434f;

            border-radius: 11px;

            background:
                linear-gradient(
                    180deg,
                    #1d2a35,
                    #18232d
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }


        .new-chat-button:hover {
            background: #263642;
        }


        .new-chat-button:active {
            transform: scale(0.98);
        }


        /* =================================================
           SEARCH
        ================================================= */

        .history-search {
            margin:
                0 15px 12px;

            padding:
                9px 11px;

            display: flex;
            align-items: center;

            gap: 8px;

            background: #19232c;

            border:
                1px solid transparent;

            border-radius: 9px;

            color: #73808d;

            transition:
                border 0.2s ease;
        }


        .history-search:focus-within {
            border-color: #34556d;
        }


        .history-search input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            color: white;
        }


        .history-search input::placeholder {
            color: #6e7b87;
        }


        /* =================================================
           HISTORY
        ================================================= */

        .history-list {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 0 10px;
        }


        .history-date {
            padding:
                10px 7px 5px;

            color: #697682;

            font-size: 11px;

            text-transform: uppercase;
        }


        .history-item {
            display: flex;
            align-items: center;

            gap: 9px;

            padding: 10px;

            margin-bottom: 3px;

            border-radius: 8px;

            cursor: pointer;

            color: #c4cdd5;

            transition:
                background 0.2s ease;
        }


        .history-item:hover {
            background: #1d2933;
        }


        .history-item.active {
            background:
                linear-gradient(
                    90deg,
                    #233846,
                    #20313d
                );
        }


        .history-item-title {
            flex: 1;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            font-size: 13px;
        }


        .history-actions {
            display: flex;

            gap: 2px;
        }


        .history-action {
            border: none;

            background: transparent;

            color: #778592;

            cursor: pointer;

            padding: 4px;
        }


        .history-action:hover {
            color: white;
        }


        /* =================================================
           SIDEBAR BOTTOM
        ================================================= */

        .sidebar-bottom {
            padding: 10px;

            border-top:
                1px solid #27333f;
        }


        .sidebar-menu-button {
            width: 100%;

            border: none;

            border-radius: 8px;

            background: transparent;

            color: #adb8c2;

            text-align: left;

            padding: 10px;

            display: flex;

            gap: 10px;

            cursor: pointer;

            transition:
                background 0.2s ease;
        }


        .sidebar-menu-button:hover {
            background: #1d2933;

            color: white;
        }


        /* =================================================
           MAIN
        ================================================= */

        .main-area {
            flex: 1;

            min-width: 0;
            min-height: 0;

            height: 100vh;
            height: 100dvh;

            display: flex;

            flex-direction: column;

            position: relative;
        }


        /* =================================================
           HEADER
        ================================================= */

        .oma-header {
            height: 75px;

            min-height: 75px;

            flex-shrink: 0;

            padding:
                10px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background:
                rgba(17, 24, 32, 0.94);

            border-bottom:
                1px solid #27333f;

            position: relative;

            z-index: 100;

            backdrop-filter: blur(14px);
        }


        .header-left {
            display: flex;
            align-items: center;

            gap: 11px;

            min-width: 0;
        }


        .header-left h1 {
            margin: 0;

            font-size: 22px;

            letter-spacing: 0.2px;
        }


        .header-left p {
            margin: 0;

            color: #758391;

            font-size: 11px;
        }


        .oma-logo {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            border-radius: 50%;

            overflow: hidden;

            background: #1b2630;

            border:
                1px solid #354451;

            box-shadow:
                0 0 20px rgba(52, 127, 189, 0.08);
        }


        .oma-logo img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        .header-right {
            display: flex;
            align-items: center;

            gap: 10px;

            flex-shrink: 0;
        }


        .connection-status {
            display: flex;
            align-items: center;

            gap: 7px;

            color: #85919d;

            font-size: 12px;
        }


        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #e04d4d;

            box-shadow:
                0 0 0 3px rgba(224, 77, 77, 0.08);
        }


        .status-dot.online {
            background: #38c978;

            box-shadow:
                0 0 0 3px rgba(56, 201, 120, 0.10);
        }


        .header-button {
            width: 38px;
            height: 38px;

            border: none;

            border-radius: 9px;

            background: #1b2630;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }


        .header-button:hover {
            background: #293743;
        }


        .header-button:active {
            transform: scale(0.95);
        }


        /* =================================================
           CHAT
        ================================================= */

        .oma-chat {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding:
                25px 20px 30px;

            scroll-behavior: smooth;
        }


        .chat-container {
            width: 100%;

            max-width: 900px;

            margin: auto;

            padding-bottom: 10px;
        }


        /* =================================================
           WELCOME
        ================================================= */

        .welcome {
            text-align: center;

            padding:
                55px 20px 35px;
        }


        .welcome-logo {
            display: none;
        }


        .welcome h2 {
            margin-top: 10px;

            font-size: 30px;

            letter-spacing: -0.4px;
        }


        .welcome p {
            color: #788591;

            font-size: 14px;
        }


        /* =================================================
           QUICK ACTIONS
        ================================================= */

        .quick-actions {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            max-width: 650px;

            margin:
                30px auto;
        }


        .quick-action {
            padding: 16px 10px;

            border:
                1px solid #2c3944;

            background:
                linear-gradient(
                    180deg,
                    #151f28,
                    #121b23
                );

            border-radius: 12px;

            color: #b9c4cd;

            cursor: pointer;

            transition:
                0.2s ease;
        }


        .quick-action:hover {
            background: #202d38;

            transform:
                translateY(-2px);

            color: white;

            border-color: #3b4e5d;
        }


        .quick-action:active {
            transform: translateY(0);
        }


        .quick-action i {
            display: block;

            font-size: 20px;

            margin-bottom: 7px;
        }


        .quick-action span {
            font-size: 11px;
        }


        /* =================================================
           MESSAGES
        ================================================= */

        .message {
            display: flex;

            gap: 12px;

            margin-bottom: 24px;

            animation:
                messageAppear 0.18s ease-out;
        }


        @keyframes messageAppear {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .message-avatar {
            width: 38px;
            height: 38px;

            min-width: 38px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #202c37;

            font-weight: bold;

            border:
                1px solid #33424f;
        }


        .message-body {
            max-width: 78%;

            min-width: 0;
        }


        .message-name {
            display: block;

            color: #84919d;

            font-size: 11px;

            margin-bottom: 5px;
        }


        .message-time {
            color: #65727e;

            font-size: 10px;

            margin-left: 6px;

            font-weight: normal;
        }


        .message-text {
            background:
                linear-gradient(
                    180deg,
                    #1b2630,
                    #18222b
                );

            padding:
                12px 15px;

            border-radius: 13px;

            line-height: 1.55;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            border:
                1px solid #263540;
        }


        .user-message {
            justify-content: flex-end;
        }


        .user-message .message-body {
            order: 1;
        }


        .user-message .message-avatar {
            order: 2;

            background: #28628f;

            border-color: #3978a5;
        }


        .user-message .message-text {
            background:
                linear-gradient(
                    180deg,
                    #285f87,
                    #24577f
                );

            border-color: #32729d;
        }


        .uploaded-image {
            display: block;

            max-width: 280px;
            max-height: 280px;

            border-radius: 12px;

            margin-top: 8px;

            border:
                1px solid #344450;
        }


        /* =================================================
           COPY AREA
        ================================================= */

        .message-tools {
            display: flex;

            align-items: center;

            margin-top: 5px;

            gap: 5px;
        }


        .copy-button {
            border: none;

            background: transparent;

            color: #697782;

            padding: 4px 7px;

            border-radius: 6px;

            font-size: 11px;

            cursor: pointer;

            display: inline-flex;
            align-items: center;

            gap: 5px;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .copy-button:hover {
            background: #1d2933;

            color: #d6dde3;
        }


        .copy-button.copied {
            color: #53c98a;
        }


        /* =================================================
           THINKING ANIMATION
        ================================================= */

        .thinking-message {
            display: flex;

            align-items: flex-start;

            gap: 12px;

            margin-bottom: 24px;

            animation:
                messageAppear 0.2s ease-out;
        }


        .thinking-avatar {
            width: 38px;
            height: 38px;

            min-width: 38px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #202c37;

            border:
                1px solid #33424f;
        }


        .thinking-body {
            display: flex;
            flex-direction: column;

            gap: 5px;
        }


        .thinking-name {
            color: #84919d;

            font-size: 11px;
        }


        .thinking-bubble {
            display: flex;

            align-items: center;

            gap: 5px;

            padding:
                13px 16px;

            background:
                linear-gradient(
                    180deg,
                    #1b2630,
                    #18222b
                );

            border:
                1px solid #263540;

            border-radius: 13px;
        }


        .thinking-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #8d9aa5;

            animation:
                thinkingBounce 1.3s infinite ease-in-out;
        }


        .thinking-dot:nth-child(2) {
            animation-delay: 0.15s;
        }


        .thinking-dot:nth-child(3) {
            animation-delay: 0.3s;
        }


        @keyframes thinkingBounce {

            0%,
            60%,
            100% {
                transform: translateY(0);

                opacity: 0.45;
            }

            30% {
                transform: translateY(-4px);

                opacity: 1;
            }

        }


        /* =================================================
           INPUT
        ================================================= */

        .oma-input-section {
            flex-shrink: 0;

            padding:
                10px 20px
                calc(14px + env(safe-area-inset-bottom));

            background:
                rgba(17, 24, 32, 0.97);

            border-top:
                1px solid #27333f;

            position: relative;

            z-index: 90;

            backdrop-filter: blur(14px);
        }


        .input-container {
            width: 100%;

            max-width: 900px;

            margin: auto;
        }


        .oma-input-box {
            display: flex;

            align-items: flex-end;

            gap: 7px;

            padding: 8px;

            background:
                linear-gradient(
                    180deg,
                    #1b2630,
                    #18222b
                );

            border:
                1px solid #35424e;

            border-radius: 15px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.12);
        }


        .oma-input-box:focus-within {
            border-color: #46718e;

            box-shadow:
                0 0 0 3px rgba(52, 127, 189, 0.08);
        }


        .oma-textarea {
            flex: 1;

            resize: none;

            min-height: 42px;
            max-height: 130px;

            padding: 10px;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            font-size: 15px;
        }


        .oma-textarea::placeholder {
            color: #73808d;
        }


        .input-button {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            font-size: 17px;

            transition:
                background 0.2s ease,
                transform 0.15s ease;
        }


        .input-button:active {
            transform: scale(0.94);
        }


        .mic-button {
            background: transparent;

            color: #d6dde3;
        }


        .mic-button:hover {
            background: #27333e;
        }


        .send-button {
            background:
                linear-gradient(
                    180deg,
                    #3b8bc9,
                    #347fbd
                );

            color: white;

            box-shadow:
                0 4px 14px rgba(52, 127, 189, 0.18);
        }


        .send-button:hover {
            background: #438dca;
        }


        .send-button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            box-shadow: none;
        }


        /* =================================================
           ATTACHMENT
        ================================================= */

        .attachment-bar {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 7px;

            min-height: 24px;
        }


        .attachment-button {
            padding:
                6px 10px;

            border-radius: 8px;

            background: #1b2630;

            color: #a8b4bf;

            font-size: 11px;

            cursor: pointer;

            border:
                1px solid transparent;

            transition:
                background 0.2s ease;
        }


        .attachment-button:hover {
            background: #283540;
        }


        #imageUpload {
            display: none;
        }


        #imageName {
            color: #687681;

            font-size: 10px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =================================================
           STATUS
        ================================================= */

        .oma-status {
            margin-top: 5px;

            color: #65727e;

            font-size: 10px;

            min-height: 14px;
        }


        .oma-footer {
            text-align: center;

            color: #596570;

            font-size: 9px;

            margin-top: 4px;
        }


        /* =================================================
           MODALS
        ================================================= */

        .oma-modal {
            background: #121a22;

            color: white;

            border:
                1px solid #2c3945;
        }


        .oma-modal .modal-header {
            border-bottom-color:
                #293540;
        }


        .oma-modal .modal-footer {
            border-top-color:
                #293540;
        }


        .oma-modal .form-control,
        .oma-modal .form-select {
            background: #1b2630;

            border-color:
                #35424e;

            color: white;
        }


        .oma-modal .form-select option {
            background: #1b2630;

            color: white;
        }


        .oma-modal small {
            color: #788591;
        }


        /* =================================================
           SIDEBAR OVERLAY
        ================================================= */

        .sidebar-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.6);

            z-index: 1900;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 768px) {

            .history-sidebar {
                position: fixed;

                left: -285px;

                top: 0;

                height: 100vh;
                height: 100dvh;

                transition:
                    left 0.25s ease;
            }


            .history-sidebar.open {
                left: 0;
            }


            .sidebar-overlay.show {
                display: block;
            }


            .main-area {
                width: 100%;

                height: 100vh;
                height: 100dvh;
            }


            .oma-header {
                height: 64px;

                min-height: 64px;

                padding:
                    7px 10px;
            }


            .oma-chat {
                padding:
                    15px 10px 20px;
            }


            .oma-input-section {
                padding:
                    7px 10px
                    calc(9px + env(safe-area-inset-bottom));
            }


            .message-body {
                max-width: 85%;
            }


            .header-left p {
                display: none;
            }


            .connection-status span:last-child {
                display: none;
            }


            .connection-status {
                gap: 4px;
            }


            .header-button {
                width: 36px;
                height: 36px;
            }


            .quick-actions {
                grid-template-columns:
                    repeat(2, 1fr);
            }


            .welcome {
                padding:
                    35px 10px 25px;
            }


            .welcome h2 {
                font-size: 26px;
            }


            .quick-action {
                min-height: 76px;
            }


            .attachment-bar {
                margin-top: 5px;
            }

        }


        /* =================================================
           SMALL PHONES
        ================================================= */

        @media (max-width: 420px) {

            .oma-logo {
                width: 40px;
                height: 40px;
            }


            .header-left h1 {
                font-size: 18px;
            }


            .quick-actions {
                gap: 8px;
            }


            .quick-action {
                padding:
                    11px 6px;

                min-height: 70px;
            }


            .quick-action i {
                font-size: 18px;
            }


            .message {
                gap: 8px;

                margin-bottom: 19px;
            }


            .message-avatar,
            .thinking-avatar {
                width: 34px;
                height: 34px;

                min-width: 34px;

                font-size: 12px;
            }


            .message-body {
                max-width: 88%;
            }


            .message-text {
                padding:
                    10px 12px;

                font-size: 14px;
            }


            .oma-input-box {
                padding: 6px;

                border-radius: 13px;
            }


            .oma-textarea {
                min-height: 40px;

                padding:
                    9px 7px;

                font-size: 14px;
            }


            .input-button {
                width: 40px;
                height: 40px;
            }


            .oma-footer {
                display: none;
            }

        }


        /* =================================================
           VERY SMALL PHONES
        ================================================= */

        @media (max-width: 350px) {

            .oma-header {
                padding:
                    6px 7px;
            }


            .oma-chat {
                padding-left: 7px;
                padding-right: 7px;
            }


            .oma-input-section {
                padding-left: 7px;
                padding-right: 7px;
            }


            .connection-status {
                display: none;
            }


            .quick-actions {
                grid-template-columns:
                    1fr 1fr;
            }

        }


        /* =================================================
           SCROLLBAR
        ================================================= */

        ::-webkit-scrollbar {
            width: 7px;
        }


        ::-webkit-scrollbar-track {
            background: transparent;
        }


        ::-webkit-scrollbar-thumb {
            background: #293640;

/* =========================================================
   BACKEND HEALTH CHECK
   ========================================================= */

async function checkBackend() {

    console.log(
        "OMA: Starting backend health check..."
    );


    if (
        !statusText ||
        !statusDot ||
        !omaStatus
    ) {

        console.error(
            "OMA: Status elements are missing."
        );

        return;

    }


    statusText.textContent =
        "Checking...";


    statusDot.classList.remove(
        "online"
    );


    omaStatus.textContent =
        "Checking OMA cloud...";


    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            function() {

                console.warn(
                    "OMA: Health check timed out."
                );

                controller.abort();

            },
            15000
        );


    try {

        console.log(
            "OMA: Requesting:",
            OMA_HEALTH_ENDPOINT
        );


        const response =
            await fetch(
                OMA_HEALTH_ENDPOINT,
                {
                    method: "GET",

                    cache: "no-store",

                    signal:
                        controller.signal
                }
            );


        clearTimeout(timeout);


        console.log(
            "OMA: Health HTTP status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "Health check HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "OMA: Health response:",
            data
        );


        if (
            data &&
            data.status === "healthy"
        ) {

            statusText.textContent =
                "Online";


            statusDot.classList.add(
                "online"
            );


            omaStatus.textContent =
                "OMA cloud connected";


        } else {

            throw new Error(
                "Unexpected health response: " +
                JSON.stringify(data)
            );

        }

    }

    catch (error) {

        clearTimeout(timeout);


        console.error(
            "OMA: Backend health check failed:",
            error
        );


        statusText.textContent =
            "Offline";


        statusDot.classList.remove(
            "online"
        );


        if (
            error.name ===
            "AbortError"
        ) {

            omaStatus.textContent =
                "OMA cloud timeout";

        } else {

            omaStatus.textContent =
                "OMA cloud unavailable";

        }

    }

}


/* =========================================================
   LOAD HISTORY
   ========================================================= */

function loadHistory() {

    console.log(
        "OMA: Loading chat history..."
    );


    const saved =
        localStorage.getItem(
            "omaConversations"
        );


    if (saved) {

        try {

            conversations =
                JSON.parse(saved);


            if (
                !Array.isArray(
                    conversations
                )
            ) {

                conversations = [];

            }

        }

        catch (error) {

            console.error(
                "OMA: Could not load history:",
                error
            );

            conversations = [];

        }

    }


    if (
        conversations.length > 0
    ) {

        currentConversationId =
            conversations[0].id;


        renderConversation();

    }

    else {

        createNewChat();

    }


    renderHistory();

}


/* =========================================================
   SAVE HISTORY
   ========================================================= */

function saveHistory() {

    const setting =
        document.getElementById(
            "saveHistorySetting"
        );


    if (
        setting &&
        !setting.checked
    ) {

        return;

    }


    try {

        localStorage.setItem(
            "omaConversations",
            JSON.stringify(
                conversations
            )
        );

    }

    catch (error) {

        console.error(
            "OMA: Failed to save history:",
            error
        );

    }

}


/* =========================================================
   CREATE NEW CHAT
   ========================================================= */

function createNewChat() {

    const chat = {

        id:
            Date.now().toString(),

        title:
            "New Chat",

        messages: [],

        createdAt:
            new Date().toISOString(),

        updatedAt:
            new Date().toISOString()

    };


    conversations.unshift(
        chat
    );


    currentConversationId =
        chat.id;


    saveHistory();

    renderHistory();

    renderConversation();

    closeSidebar();

}


/* =========================================================
   GET CURRENT CHAT
   ========================================================= */

function getCurrentChat() {

    return conversations.find(
        function(chat) {

            return (
                chat.id ===
                currentConversationId
            );

        }
    );

}


/* =========================================================
   OPEN CONVERSATION
   ========================================================= */

function openConversation(id) {

    const chat =
        conversations.find(
            function(item) {

                return (
                    item.id === id
                );

            }
        );


    if (!chat) {

        return;

    }


    currentConversationId =
        id;


    renderConversation();

    renderHistory();

    closeSidebar();

}


/* =========================================================
   FORMAT MESSAGE TIME
   ========================================================= */

function formatMessageTime(timestamp) {

    if (!timestamp) {

        return "";

    }


    const date =
        new Date(timestamp);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleTimeString([], {

        hour:
            "numeric",

        minute:
            "2-digit"

    });

}


/* =========================================================
   FORMAT MESSAGE DATE
   ========================================================= */

function formatMessageDate(timestamp) {

    if (!timestamp) {

        return "";

    }


    const date =
        new Date(timestamp);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    const today =
        new Date();


    const yesterday =
        new Date();


    yesterday.setDate(
        yesterday.getDate() - 1
    );


    if (
        date.toDateString() ===
        today.toDateString()
    ) {

        return "Today";

    }


    if (
        date.toDateString() ===
        yesterday.toDateString()
    ) {

        return "Yesterday";

    }


    return date.toLocaleDateString([], {

        day:
            "numeric",

        month:
            "long",

        year:
            "numeric"

    });

}


/* =========================================================
   RENDER CONVERSATION
   ========================================================= */

function renderConversation() {

    const chat =
        getCurrentChat();


    if (!messages) {

        return;

    }


    messages.innerHTML = "";


    if (
        !chat ||
        !Array.isArray(
            chat.messages
        ) ||
        chat.messages.length === 0
    ) {

        showWelcome();

        return;

    }


    let lastMessageDate = "";


    chat.messages.forEach(
        function(message) {

            const messageDate =
                formatMessageDate(
                    message.time
                );


            if (
                messageDate &&
                messageDate !== lastMessageDate
            ) {

                const dateSeparator =
                    document.createElement(
                        "div"
                    );


                dateSeparator.style.textAlign =
                    "center";


                dateSeparator.style.color =
                    "#65727e";


                dateSeparator.style.fontSize =
                    "10px";


                dateSeparator.style.margin =
                    "15px 0";


                dateSeparator.textContent =
                    messageDate;


                messages.appendChild(
                    dateSeparator
                );


                lastMessageDate =
                    messageDate;

            }


            renderMessage(
                message
            );

        }
    );


    scrollBottom();

}

/* =========================================================
   ADD MESSAGE
   ========================================================= */

function addMessage(
    sender,
    text,
    image = null
) {

    const chat =
        getCurrentChat();


    if (!chat) {

        return;

    }


    if (
        !Array.isArray(
            chat.messages
        )
    ) {

        chat.messages = [];

    }


    chat.messages.push({

        sender:
            sender,

        text:
            text || "",

        image:
            image,

        time:
            new Date().toISOString()

    });


    if (
        sender === "user" &&
        chat.title === "New Chat"
    ) {

        const titleText =
            text &&
            text.trim()
                ? text.trim()
                : "Image Chat";


        chat.title =
            titleText.substring(
                0,
                35
            );

    }


    chat.updatedAt =
        new Date().toISOString();


    saveHistory();

    renderConversation();

    renderHistory();

}


/* =========================================================
   RENDER MESSAGE
   ========================================================= */

function renderMessage(message) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        (
            message.sender === "user"
                ? "user-message"
                : ""
        );


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "message-avatar";


    avatar.textContent =
        message.sender === "user"
            ? "U"
            : "O";


    const body =
        document.createElement(
            "div"
        );


    body.className =
        "message-body";


    const name =
        document.createElement(
            "span"
        );


    name.className =
        "message-name";


    name.textContent =
        message.sender === "user"
            ? "You"
            : "OMA";


    const time =
        formatMessageTime(
            message.time
        );


    if (time) {

        const timeElement =
            document.createElement(
                "span"
            );


        timeElement.className =
            "message-time";


        timeElement.textContent =
            time;


        name.appendChild(
            timeElement
        );

    }


    const text =
        document.createElement(
            "div"
        );


    text.className =
        "message-text";


    text.textContent =
        message.text || "";


    body.appendChild(
        name
    );


    body.appendChild(
        text
    );


    if (message.image) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            message.image;


        image.className =
            "uploaded-image";


        image.alt =
            "Uploaded image";


        body.appendChild(
            image
        );

    }


    /* =====================================================
       COPY BUTTON FOR OMA
    ====================================================== */

    if (
        message.sender === "oma" &&
        message.text
    ) {

        const tools =
            document.createElement(
                "div"
            );


        tools.className =
            "message-tools";


        const copyButton =
            document.createElement(
                "button"
            );


        copyButton.className =
            "copy-button";


        copyButton.type =
            "button";


        copyButton.innerHTML =
            '<i class="bi bi-copy"></i><span>Copy</span>';


        copyButton.onclick =
            async function() {

                try {

                    await navigator.clipboard.writeText(
                        message.text
                    );


                    copyButton.classList.add(
                        "copied"
                    );


                    copyButton.innerHTML =
                        '<i class="bi bi-check2"></i><span>Copied</span>';


                    setTimeout(
                        function() {

                            copyButton.classList.remove(
                                "copied"
                            );


                            copyButton.innerHTML =
                                '<i class="bi bi-copy"></i><span>Copy</span>';

                        },
                        1500
                    );

                }

                catch (error) {

                    console.error(
                        "OMA: Copy failed:",
                        error
                    );

                    copyButton.innerHTML =
                        '<i class="bi bi-x"></i><span>Failed</span>';

                }

            };


        tools.appendChild(
            copyButton
        );


        body.appendChild(
            tools
        );

    }


    wrapper.appendChild(
        avatar
    );


    wrapper.appendChild(
        body
    );


    messages.appendChild(
        wrapper
    );

}

/* =========================================================
   SEND MESSAGE
   ========================================================= */

function sendMessage() {

    if (
        sendButton &&
        sendButton.disabled
    ) {

        return;

    }


    const text =
        messageInput.value.trim();


    if (
        !text &&
        !selectedImage
    ) {

        return;

    }


    if (selectedImage) {

        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                finishSending(
                    text,
                    event.target.result
                );

            };


        reader.onerror =
            function(error) {

                console.error(
                    "OMA: Image read error:",
                    error
                );

                omaStatus.textContent =
                    "Could not read image";

            };


        reader.readAsDataURL(
            selectedImage
        );

    }

    else {

        finishSending(
            text,
            null
        );

    }

}


/* =========================================================
   CLOUD CHAT
   ========================================================= */

async function finishSending(
    text,
    image
) {

    console.log(
        "OMA: Sending message..."
    );


    addMessage(
        "user",
        text || "Image",
        image
    );


    messageInput.value =
        "";


    messageInput.style.height =
        "auto";


    clearImage();


    omaStatus.textContent =
        "OMA is thinking...";


    sendButton.disabled =
        true;


    /* SHOW THINKING ANIMATION */

    showThinking();


    try {

        console.log(
            "OMA: POST",
            OMA_CHAT_ENDPOINT
        );


        const requestBody = {

            message:
                text ||
                "Please analyze this image."

        };


        const response =
            await fetch(
                OMA_CHAT_ENDPOINT,
                {

                    method:
                        "POST",

                    headers:
                        {
                            "Content-Type":
                                "application/json"
                        },

                    body:
                        JSON.stringify(
                            requestBody
                        )

                }
            );


        console.log(
            "OMA: Chat HTTP status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "OMA: Chat response:",
            data
        );


        const omaReply =
            data.response ||
            data.message ||
            data.reply ||
            data.answer;


        if (!omaReply) {

            throw new Error(
                "Backend returned no response text."
            );

        }


        /* REMOVE THINKING BEFORE RESPONSE */

        removeThinking();


        addMessage(
            "oma",
            omaReply
        );


        omaStatus.textContent =
            "OMA is ready";


        console.log(
            "OMA: Message successfully received."
        );

    }

    catch (error) {

        console.error(
            "OMA: Chat backend error:",
            error
        );


        removeThinking();


        addMessage(
            "oma",
            "I couldn't reach the OMA cloud backend right now."
        );


        omaStatus.textContent =
            "Backend connection error";

    }

    finally {

        sendButton.disabled =
            false;

    }

}

/* =========================================================
   RENDER HISTORY
   ========================================================= */

function renderHistory() {

    if (!historyList) {

        return;

    }


    historyList.innerHTML =
        "";


    const search =
        historySearch
            ? historySearch.value
                .toLowerCase()
                .trim()
            : "";


    const filtered =
        conversations
            .filter(
                function(chat) {

                    return (
                        chat.title &&
                        chat.title
                            .toLowerCase()
                            .includes(search)
                    );

                }
            )
            .sort(
                function(a, b) {

                    return (
                        new Date(
                            b.updatedAt
                        ) -
                        new Date(
                            a.updatedAt
                        )
                    );

                }
            );


    filtered.forEach(
        function(chat) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "history-item";


            if (
                chat.id ===
                currentConversationId
            ) {

                item.classList.add(
                    "active"
                );

            }


            const icon =
                document.createElement(
                    "i"
                );


            icon.className =
                "bi bi-chat-left-text";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "history-item-title";


            title.textContent =
                chat.title ||
                "New Chat";


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "history-actions";


            const rename =
                document.createElement(
                    "button"
                );


            rename.className =
                "history-action";


            rename.type =
                "button";


            rename.title =
                "Rename";


            rename.innerHTML =
                '<i class="bi bi-pencil"></i>';


            rename.onclick =
                function(event) {

                    event.stopPropagation();

                    renameChat(
                        chat.id
                    );

                };


            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.className =
                "history-action";


            deleteButton.type =
                "button";


            deleteButton.title =
                "Delete";


            deleteButton.innerHTML =
                '<i class="bi bi-trash"></i>';


            deleteButton.onclick =
                function(event) {

                    event.stopPropagation();

                    deleteChat(
                        chat.id
                    );

                };


            actions.appendChild(
                rename
            );


            actions.appendChild(
                deleteButton
            );


            item.appendChild(
                icon
            );


            item.appendChild(
                title
            );


            item.appendChild(
                actions
            );


            item.onclick =
                function() {

                    openConversation(
                        chat.id
                    );

                };


            historyList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   DELETE CHAT
   ========================================================= */

function deleteChat(id) {

    const confirmed =
        confirm(
            "Delete this conversation?"
        );


    if (!confirmed) {

        return;

    }


    conversations =
        conversations.filter(
            function(chat) {

                return (
                    chat.id !== id
                );

            }
        );


    if (
        currentConversationId ===
        id
    ) {

        if (
            conversations.length > 0
        ) {

            currentConversationId =
                conversations[0].id;

        }

        else {

            createNewChat();

            return;

        }

    }


    saveHistory();

    renderConversation();

    renderHistory();

}


/* =========================================================
   RENAME CHAT
   ========================================================= */

function renameChat(id) {

    conversationBeingRenamed =
        id;


    const chat =
        conversations.find(
            function(item) {

                return (
                    item.id === id
                );

            }
        );


    if (!chat) {

        return;

    }


    const renameInput =
        document.getElementById(
            "renameInput"
        );


    if (renameInput) {

        renameInput.value =
            chat.title;

    }


    const modalElement =
        document.getElementById(
            "renameModal"
        );


    if (!modalElement) {

        return;

    }


    const modal =
        new bootstrap.Modal(
            modalElement

    modal.show();

}

function saveAlarm() {

    const alarmInput =
        document.getElementById(
            "alarmTime"
        );


    if (!alarmInput) {

        return;

    }


    const time =
        alarmInput.value;


    if (!time) {

        alert(
            "Please select a time."
        );

        return;

    }


    if (alarmInterval) {

        clearInterval(
            alarmInterval
        );

    }


    alarmInterval =
        setInterval(
            function() {

                const now =
                    new Date();


                const current =
                    now
                        .toTimeString()
                        .slice(
                            0,
                            5
                        );


                if (
                    current === time
                ) {

                    clearInterval(
                        alarmInterval
                    );


                    omaStatus.textContent =
                        "Alarm ringing";


                    alert(
                        "OMA Alarm: " +
                        time
                    );

                }

            },
            1000
        );


    omaStatus.textContent =
        "Alarm set for " +
        time;


    alert(
        "Alarm set for " +
        time
    );


    const modalElement =
        document.getElementById(
            "alarmModal"
        );


    const modal =
        bootstrap.Modal.getInstance(
            modalElement
        );


    if (modal) {

        modal.hide();

    }

}


/* =========================================================

   ========================================================= */

function openTimer() {

function saveTimer() {

    const minutesInput =
        document.getElementById(
            "timerMinutes"
        );


    const secondsInput =
        document.getElementById(
            "timerSeconds"
        );


    if (
        !minutesInput ||
        !secondsInput
    ) {

        return;

    }


    const minutes =
        Number(
            minutesInput.value
        );


    const seconds =
        Number(
            secondsInput.value
        );


    if (
        minutes < 0 ||
        seconds < 0 ||
        seconds > 59
    ) {

        alert(
            "Please enter a valid timer."
        );

        return;

    }


    let totalSeconds =
        minutes * 60 +
        seconds;


    if (
        totalSeconds <= 0
    ) {

        alert(
            "Please enter a valid timer."
        );

        return;

    }


    const modalElement =
        document.getElementById(
            "timerModal"
        );


    const modal =
        bootstrap.Modal.getInstance(
            modalElement
        );


    if (modal) {

        modal.hide();

    }


    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    omaStatus.textContent =
        "Timer running...";


    updateTimerStatus(
        totalSeconds
    );


    timerInterval =
        setInterval(
            function() {

                totalSeconds--;


                if (
                    totalSeconds <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    timerInterval =
                        null;


                    omaStatus.textContent =
                        "Timer finished";


                    alert(
                        "OMA Timer finished!"
                    );


                    return;

                }


                updateTimerStatus(
                    totalSeconds
                );

            },
            1000
        );

}


function updateTimerStatus(
    totalSeconds
) {

    const mins =
        Math.floor(
            totalSeconds / 60
        );


    const secs =
        totalSeconds % 60;


    omaStatus.textContent =
        "Timer: " +
        mins +
        ":" +
        String(secs)
            .padStart(
                2,
                "0"
            );

}


/* =========================================================
   MICROPHONE
   ========================================================= */

function setupMicrophone() {

    console.log(
        "OMA: Setting up microphone..."
    );


    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        console.warn(
            "OMA: Speech recognition is not supported."
        );


        if (micButton) {

            micButton.onclick =
                function() {

                    alert(
                        "Voice input is not supported by this browser."
                    );

                };

        }


        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            isListening =
                true;


            omaStatus.textContent =
                "Listening...";


            if (micButton) {

                micButton.innerHTML =
                    '<i class="bi bi-mic-fill"></i>';

            }

        };


    recognition.onresult =
        function(event) {

            const transcript =
                event.results[0][0]
                    .transcript;


            messageInput.value =
                transcript;


            messageInput.dispatchEvent(
                new Event(
                    "input"
                )
            );


            omaStatus.textContent =
                "Voice captured";

        };


    recognition.onerror =
        function(event) {

            console.error(
                "OMA: Microphone error:",
                event.error
            );


            omaStatus.textContent =
                "Microphone error";

        };


    recognition.onend =
        function() {

            isListening =
                false;


            if (micButton) {

                micButton.innerHTML =
                    '<i class="bi bi-mic"></i>';

            }

        };


    if (micButton) {

        micButton.addEventListener(
            "click",
            function() {

                if (isListening) {

                    recognition.stop();

                    return;

                }


                try {

                    recognition.start();

                }

                catch (error) {

                    console.error(
                        "OMA: Could not start microphone:",
                        error
                    );

                }

            }
        );

    }

}
