<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OMA - AI Assistant</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="bootstrap icons/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         OMA CSS
    ====================================================== -->

<style>

/* =========================================================
   OMA — PROFESSIONAL DESIGN SYSTEM
   ========================================================= */

:root {

    /* ---------- Brand ---------- */

    --oma-accent: #4F8CFF;
    --oma-accent-hover: #6A9FFF;
    --oma-accent-soft: rgba(79, 140, 255, 0.14);

    --oma-success: #35D07F;
    --oma-danger: #FF5C6C;
    --oma-warning: #FFB547;


    /* ---------- Backgrounds ---------- */

    --oma-bg: #080B10;
    --oma-bg-secondary: #0F141B;

    --oma-surface: #151C25;
    --oma-surface-2: #1B2430;
    --oma-surface-3: #222D39;


    /* ---------- Borders ---------- */

    --oma-border: #26313D;
    --oma-border-light: #33404E;


    /* ---------- Text ---------- */

    --oma-text: #F5F7FA;
    --oma-text-secondary: #AAB5C1;
    --oma-text-muted: #718091;
    --oma-text-disabled: #56616D;


    /* ---------- Message Bubbles ---------- */

    --oma-oma-message: #151D26;
    --oma-oma-message-hover: #1A232D;

    --oma-user-message: #2869AD;
    --oma-user-message-hover: #3076BD;


    /* ---------- Shadows ---------- */

    --oma-shadow:
        0 10px 35px rgba(0, 0, 0, 0.25);

    --oma-shadow-soft:
        0 4px 16px rgba(0, 0, 0, 0.16);

    /* Stronger message bubble shadow */
    --oma-message-shadow:
        0 8px 24px rgba(0, 0, 0, 0.32),
        0 2px 6px rgba(0, 0, 0, 0.20);


    /* ---------- Radius ---------- */

    --oma-radius-sm: 8px;
    --oma-radius-md: 12px;
    --oma-radius-lg: 16px;
    --oma-radius-xl: 20px;


    /* ---------- Animation ---------- */

    --oma-transition: 0.3s ease;

}


/* =========================================================
   LIGHT MODE
   ========================================================= */

html[data-theme="light"] {

    /* ---------- Backgrounds ---------- */

    --oma-bg: #F4F7FA;
    --oma-bg-secondary: #EEF2F6;

    --oma-surface: #FFFFFF;
    --oma-surface-2: #F5F7FA;
    --oma-surface-3: #E8EDF2;


    /* ---------- Borders ---------- */

    --oma-border: #D7E0E8;
    --oma-border-light: #C6D1DB;


    /* ---------- Text ---------- */

    --oma-text: #18222C;
    --oma-text-secondary: #52616D;
    --oma-text-muted: #74828E;
    --oma-text-disabled: #A5AFB8;


    /* ---------- Brand ---------- */

    --oma-accent: #2879B9;
    --oma-accent-hover: #1F6DA9;
    --oma-accent-soft: rgba(40, 121, 185, 0.11);


    /* ---------- Message Bubbles ---------- */

    --oma-user-message: #2879B9;
    --oma-user-message-hover: #216DA9;

    --oma-oma-message: #FFFFFF;
    --oma-oma-message-hover: #F7F9FB;


    /* ---------- Status ---------- */

    --oma-success: #249B5A;
    --oma-danger: #D54242;
    --oma-warning: #C78316;


    /* ---------- Stronger Light Mode Shadows ---------- */

    --oma-shadow:
        0 10px 35px rgba(30, 50, 70, 0.10);

    --oma-shadow-soft:
        0 4px 16px rgba(30, 50, 70, 0.07);

    --oma-message-shadow:
        0 8px 24px rgba(30, 50, 70, 0.18),
        0 2px 6px rgba(30, 50, 70, 0.10);

}


/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--oma-bg);

    color:
        var(--oma-text);

    overflow: hidden;

    transition:
        background-color var(--oma-transition),
        color var(--oma-transition);

}


button,
input,
textarea,
select {
    font-family: inherit;
}


button {

    transition:
        background-color 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.2s ease,
        box-shadow 0.25s ease;

}


/* =========================================================
   APP
   ========================================================= */

.oma-app {

    width: 100%;
    height: 100vh;

    display: flex;

    background:
        var(--oma-bg);

    transition:
        background-color var(--oma-transition);

}


/* =========================================================
   SIDEBAR
   ========================================================= */

.history-sidebar {

    width: 285px;
    height: 100vh;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    background:
        var(--oma-surface);

    border-right:
        1px solid var(--oma-border);

    z-index: 2000;

    transition:
        background-color var(--oma-transition),
        border-color var(--oma-transition),
        left 0.25s ease;

}


.sidebar-header {

    height: 72px;

    padding:
        12px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom:
        1px solid var(--oma-border);

}


.sidebar-brand {

    display: flex;
    align-items: center;

    gap: 10px;

    font-size: 18px;

}


.small-logo {

    width: 40px;
    height: 40px;

    border-radius: 50%;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        var(--oma-surface-3);

    border:
        1px solid var(--oma-border);

}


.small-logo img {

    width: 100%;
    height: 100%;

    object-fit: contain;

}


.sidebar-icon-button {

    width: 35px;
    height: 35px;

    border: none;

    border-radius:
        var(--oma-radius-sm);

    background: transparent;

    color:
        var(--oma-text-muted);

    cursor: pointer;

}


.sidebar-icon-button:hover {

    background:
        var(--oma-surface-3);

    color:
        var(--oma-text);

    transform:
        scale(1.04);

}


/* =========================================================
   NEW CHAT
   ========================================================= */

.new-chat-button {

    margin: 15px;

    padding: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    border:
        1px solid var(--oma-border-light);

    border-radius:
        var(--oma-radius-sm);

    background:
        var(--oma-surface-2);

    color:
        var(--oma-text);

    cursor: pointer;

}


.new-chat-button:hover {

    background:
        var(--oma-accent-soft);

    border-color:
        var(--oma-accent);

    transform:
        translateY(-1px);

}


/* =========================================================
   SEARCH
   ========================================================= */

.history-search {

    margin:
        0 15px 12px;

    padding:
        9px 11px;

    display: flex;
    align-items: center;

    gap: 8px;

    background:
        var(--oma-surface-2);

    border:
        1px solid transparent;

    border-radius:
        9px;

    color:
        var(--oma-text-muted);

    transition:
        background-color var(--oma-transition),
        border-color 0.2s ease,
        box-shadow 0.2s ease;

}


.history-search:focus-within {

    border-color:
        var(--oma-accent);

    box-shadow:
        0 0 0 3px var(--oma-accent-soft);

}


.history-search input {

    width: 100%;

    border: none;
    outline: none;

    background: transparent;

    color:
        var(--oma-text);

}


.history-search input::placeholder {

    color:
        var(--oma-text-muted);

}


/* =========================================================
   HISTORY
   ========================================================= */

.history-list {

    flex: 1;

    overflow-y: auto;

    padding:
        0 10px;

}


.history-date {

    padding:
        10px 7px 5px;

    color:
        var(--oma-text-muted);

    font-size: 11px;

    text-transform:
        uppercase;

}


.history-item {

    display: flex;
    align-items: center;

    gap: 9px;

    padding: 10px;

    margin-bottom: 3px;

    border-radius:
        var(--oma-radius-sm);

    cursor: pointer;

    color:
        var(--oma-text-secondary);

    transition:
        background-color 0.2s ease,
        transform 0.2s ease;

}


.history-item:hover {

    background:
        var(--oma-surface-3);

    transform:
        translateX(2px);

}


.history-item.active {

    background:
        var(--oma-accent-soft);

    color:
        var(--oma-text);

}


.history-item-title {

    flex: 1;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;

}


.history-actions {

    display: flex;

    gap: 2px;

    opacity: 0.65;

}


.history-item:hover .history-actions {
    opacity: 1;
}


.history-action {

    border: none;

    background: transparent;

    color:
        var(--oma-text-muted);

    cursor: pointer;

    padding: 4px;

}


.history-action:hover {

    color:
        var(--oma-text);

    transform:
        scale(1.1);

}


/* =========================================================
   SIDEBAR BOTTOM
   ========================================================= */

.sidebar-bottom {

    padding: 10px;

    border-top:
        1px solid var(--oma-border);

}


.sidebar-menu-button {

    width: 100%;

    padding: 10px;

    display: flex;

    gap: 10px;

    border: none;

    border-radius:
        var(--oma-radius-sm);

    background: transparent;

    color:
        var(--oma-text-secondary);

    text-align: left;

    cursor: pointer;

}


.sidebar-menu-button:hover {

    background:
        var(--oma-surface-3);

    color:
        var(--oma-text);

}


/* =========================================================
   MAIN
   ========================================================= */

.main-area {

    flex: 1;

    min-width: 0;

    height: 100vh;

    display: flex;

    flex-direction: column;

    background:
        var(--oma-bg);

}


/* =========================================================
   HEADER
   ========================================================= */

.oma-header {

    height: 75px;

    flex-shrink: 0;

    padding:
        10px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        var(--oma-surface);

    border-bottom:
        1px solid var(--oma-border);

    transition:
        background-color var(--oma-transition),
        border-color var(--oma-transition);

}


.header-left {

    display: flex;
    align-items: center;

    gap: 11px;

}


.header-left h1 {

    margin: 0;

    font-size: 22px;

    letter-spacing:
        0.3px;

}


.header-left p {

    margin: 0;

    color:
        var(--oma-text-muted);

    font-size: 11px;

}


.oma-logo {

    width: 48px;
    height: 48px;

    border-radius: 50%;

    overflow: hidden;

    background:
        var(--oma-surface-3);

    border:
        1px solid var(--oma-border-light);

    box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.12);

}


.oma-logo img {

    width: 100%;
    height: 100%;

    object-fit: contain;

}


.header-right {

    display: flex;

    align-items: center;

    gap: 12px;

}


.connection-status {

    display: flex;

    align-items: center;

    gap: 7px;

    color:
        var(--oma-text-muted);

    font-size: 12px;

}


.status-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background:
        var(--oma-danger);

    transition:
        background-color 0.3s ease,
        box-shadow 0.3s ease;

}


.status-dot.online {

    background:
        var(--oma-success);

    box-shadow:
        0 0 10px rgba(53, 208, 127, 0.55);

    animation:
        onlinePulse 2s infinite;

}


@keyframes onlinePulse {

    0%,
    100% {
        box-shadow:
            0 0 4px rgba(53, 208, 127, 0.3);
    }

    50% {
        box-shadow:
            0 0 12px rgba(53, 208, 127, 0.7);
    }

}


.header-button {

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid transparent;

    border-radius: 9px;

    background:
        var(--oma-surface-2);

    color:
        var(--oma-text);

    cursor: pointer;

}


.header-button:hover {

    background:
        var(--oma-accent-soft);

    border-color:
        var(--oma-border-light);

    transform:
        translateY(-1px);

}


/* =========================================================
   CHAT AREA
   ========================================================= */

.oma-chat {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding:
        25px 20px;

    background:
        var(--oma-bg);

    transition:
        background-color var(--oma-transition);

}


.chat-container {

    width: 100%;

    max-width: 900px;

    margin: auto;

}


/* =========================================================
   WELCOME
   ========================================================= */

.welcome {

    text-align: center;

    padding:
        55px 20px 35px;

    animation:
        welcomeAppear 0.55s ease;

}


@keyframes welcomeAppear {

    from {

        opacity: 0;

        transform:
            translateY(15px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


.welcome h2 {

    margin-top: 10px;

    font-size: 30px;

    background:
        linear-gradient(
            90deg,
            var(--oma-text),
            var(--oma-accent)
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    color: transparent;

}


.welcome p {

    color:
        var(--oma-text-muted);

    font-size: 14px;

}


/* =========================================================
   QUICK ACTIONS
   ========================================================= */

.quick-actions {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    max-width: 650px;

    margin:
        30px auto;

}


.quick-action {

    padding:
        16px 10px;

    border:
        1px solid var(--oma-border);

    background:
        var(--oma-surface);

    border-radius:
        var(--oma-radius-md);

    color:
        var(--oma-text-secondary);

    cursor: pointer;

    transition:
        background-color 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;

}


.quick-action:hover {

    background:
        var(--oma-accent-soft);

    border-color:
        var(--oma-accent);

    transform:
        translateY(-4px);

    box-shadow:
        var(--oma-shadow);

    color:
        var(--oma-text);

}


.quick-action:active {

    transform:
        translateY(-1px);

}


.quick-action i {

    display: block;

    margin-bottom: 7px;

    font-size: 20px;

    color:
        var(--oma-accent);

}


.quick-action span {

    font-size: 11px;

}


/* =========================================================
   MESSAGES
   ========================================================= */

.message {

    display: flex;

    gap: 12px;

    margin-bottom: 26px;

    animation:
        messageAppear 0.35s ease both;

}


@keyframes messageAppear {

    from {

        opacity: 0;

        transform:
            translateY(8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* ---------- Avatar ---------- */

.message-avatar {

    width: 38px;
    height: 38px;

    min-width: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        var(--oma-surface-3);

    color:
        var(--oma-text);

    border:
        1px solid var(--oma-border);

    font-weight: bold;

}


/* ---------- Body ---------- */

.message-body {

    max-width: 78%;

    min-width: 0;

}


/* ---------- Name + time ---------- */

.message-name {

    display: block;

    margin-bottom: 6px;

    color:
        var(--oma-text-muted);

    font-size: 11px;

    font-weight: 600;

}


.message-time {

    margin-left: 7px;

    color:
        var(--oma-text-muted);

    font-size: 10px;

    font-weight: normal;

    opacity: 0.8;

}


/* =========================================================
   OMA CHAT BUBBLE
   ========================================================= */

.message-text {

    background:
        var(--oma-oma-message);

    color:
        var(--oma-text);

    padding:
        12px 15px;

    border-radius:
        14px;

    border:
        1px solid var(--oma-border);

    line-height:
        1.55;

    white-space:
        pre-wrap;

    /* Strong, visible shadow */
    box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.32),
        0 2px 6px rgba(0, 0, 0, 0.20);

    transition:
        background-color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;

}


.message:not(.user-message) .message-text:hover {

    background:
        var(--oma-oma-message-hover);

    box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.40),
        0 3px 8px rgba(0, 0, 0, 0.22);

}


/* =========================================================
   USER CHAT BUBBLE
   ========================================================= */

.user-message {

    justify-content:
        flex-end;

}


.user-message .message-body {

    order: 1;

    display: flex;

    flex-direction: column;

    align-items: flex-end;

}


.user-message .message-name {

    text-align: right;

}


.user-message .message-avatar {

    order: 2;

    background:
        var(--oma-accent);

    color:
        white;

    border-color:
        transparent;

    box-shadow:
        0 4px 12px var(--oma-accent-soft);

}


.user-message .message-text {

    background:
        var(--oma-user-message);

    color:
        #FFFFFF;

    border-color:
        transparent;

    /* Strong blue user bubble shadow */
    box-shadow:
        0 8px 24px rgba(40, 105, 173, 0.38),
        0 3px 8px rgba(0, 0, 0, 0.20);

    transition:
        background-color 0.25s ease,
        box-shadow 0.25s ease;

}


.user-message .message-text:hover {

    background:
        var(--oma-user-message-hover);

    box-shadow:
        0 10px 30px rgba(40, 105, 173, 0.48),
        0 4px 10px rgba(0, 0, 0, 0.24);

}


/* =========================================================
   MESSAGE ACTIONS
   ========================================================= */

.message-actions {

    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 7px;

}


.message-action-button {

    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid transparent;

    border-radius:
        var(--oma-radius-sm);

    background:
        transparent;

    color:
        var(--oma-text-muted);

    cursor:
        pointer;

    font-size: 14px;

}


.message-action-button:hover {

    background:
        var(--oma-surface-3);

    border-color:
        var(--oma-border);

    color:
        var(--oma-text);

    transform:
        translateY(-1px);

}


.message-action-button:active {

    transform:
        scale(0.92);

}


/* =========================================================
   IMAGE
   ========================================================= */

.uploaded-image {

    display: block;

    max-width: 280px;
    max-height: 280px;

    margin-top: 9px;

    border:
        1px solid var(--oma-border);

    border-radius:
        var(--oma-radius-md);

    object-fit: cover;

    animation:
        imageAppear 0.35s ease;

}


@keyframes imageAppear {

    from {

        opacity: 0;

        transform:
            scale(0.96);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* =========================================================
   THINKING ANIMATION
   ========================================================= */

.thinking-message {

    display: flex;

    gap: 12px;

    margin-bottom: 26px;

    animation:
        messageAppear 0.3s ease;

}


.thinking-avatar {

    width: 38px;
    height: 38px;

    min-width: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        var(--oma-accent-soft);

    color:
        var(--oma-accent);

    border:
        1px solid var(--oma-accent);

}


.thinking-body {

    max-width: 78%;

}


.thinking-name {

    margin-bottom: 6px;

    color:
        var(--oma-text-muted);

    font-size: 11px;

    font-weight: 600;

}


.thinking-box {

    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 220px;

    padding:
        13px 16px;

    background:
        var(--oma-oma-message);

    border:
        1px solid var(--oma-border);

    border-radius:
        6px 17px 17px 17px;

    box-shadow:
        var(--oma-message-shadow);

}


.thinking-copy {

    color:
        var(--oma-text-secondary);

    font-size: 13px;

    transition:
        opacity 0.18s ease;

}


.thinking-dots {

    display: flex;

    gap: 4px;

}


.thinking-dot {

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        var(--oma-accent);

    animation:
        thinkingBounce 1.2s infinite ease-in-out;

}


.thinking-dot:nth-child(2) {
    animation-delay: 0.15s;
}


.thinking-dot:nth-child(3) {
    animation-delay: 0.3s;
}


@keyframes thinkingBounce {

    0%,
    60%,
    100% {

        transform:
            translateY(0);

        opacity:
            0.45;

    }

    30% {

        transform:
            translateY(-4px);

        opacity:
            1;

    }

}


.thinking-pulse {

    animation:
        thinkingPulse 1.5s infinite;

}


@keyframes thinkingPulse {

    0%,
    100% {

        box-shadow:
            0 0 0 0 var(--oma-accent-soft);

    }

    50% {

        box-shadow:
            0 0 0 7px transparent;

    }

}


/* =========================================================
   INPUT AREA
   ========================================================= */

.oma-input-section {

    flex-shrink: 0;

    padding:
        10px 20px 14px;

    background:
        var(--oma-surface);

    border-top:
        1px solid var(--oma-border);

    transition:
        background-color var(--oma-transition),
        border-color var(--oma-transition);

}


.input-container {

    width: 100%;

    max-width: 900px;

    margin: auto;

}


.oma-input-box {

    display: flex;

    align-items: flex-end;

    gap: 7px;

    padding: 8px;

    background:
        var(--oma-surface-2);

    border:
        1px solid var(--oma-border-light);

    border-radius:
        15px;

    transition:

<script>

/* =========================================================
   OMA WEBSITE — CLEAN JAVASCRIPT
   ========================================================= */

/* =========================================================
   STARTUP
   ========================================================= */

console.log("======================================");
console.log("OMA JAVASCRIPT IS RUNNING");
console.log("======================================");


/* =========================================================
   BACKEND
   ========================================================= */

const OMA_BACKEND =
    "https://oma-backend-zezm.onrender.com";

const OMA_HEALTH_ENDPOINT =
    `${OMA_BACKEND}/health`;

const OMA_CHAT_ENDPOINT =
    `${OMA_BACKEND}/chat`;


console.log("OMA backend:", OMA_BACKEND);


/* =========================================================
   STATE
   ========================================================= */

let conversations = [];
let currentConversationId = null;
let conversationBeingRenamed = null;

let selectedImage = null;

let timerInterval = null;
let alarmInterval = null;

let recognition = null;
let isListening = false;

let thinkingInterval = null;
let thinkingCopyIndex = 0;


/* =========================================================
   THINKING MESSAGES
   ========================================================= */

const thinkingCopies = [
    "OMA is thinking",
    "OMA is working on that",
    "OMA is preparing your answer",
    "OMA is putting that together",
    "OMA is processing your request",
    "OMA is working on a response"
];


/* =========================================================
   ELEMENTS
   ========================================================= */

const elements = {
    messages: document.getElementById("messages"),
    chatArea: document.getElementById("chatArea"),
    messageInput: document.getElementById("messageInput"),
    sendButton: document.getElementById("sendButton"),

    imageUpload: document.getElementById("imageUpload"),
    imageName: document.getElementById("imageName"),

    historyList: document.getElementById("historyList"),
    historySearch: document.getElementById("historySearch"),
    historySidebar: document.getElementById("historySidebar"),
    sidebarOverlay: document.getElementById("sidebarOverlay"),

    openSidebarButton: document.getElementById("openSidebar"),
    closeSidebarButton: document.getElementById("closeSidebar"),
    newChatButton: document.getElementById("newChatButton"),

    statusText: document.getElementById("statusText"),
    statusDot: document.getElementById("statusDot"),
    omaStatus: document.getElementById("omaStatus"),

    micButton: document.getElementById("micButton"),

    appearanceSelect:
        document.getElementById("appearanceSelect"),

    saveHistorySetting:
        document.getElementById("saveHistorySetting"),

    saveRenameButton:
        document.getElementById("saveRenameButton")
};


/* =========================================================
   ELEMENT CHECK
   ========================================================= */

console.log("OMA: Checking page elements...");

Object.entries(elements).forEach(
    ([name, element]) => {

        if (!element) {
            console.warn(
                `OMA: Optional/missing element: ${name}`
            );
        }

    }
);


/* =========================================================
   SMALL HELPERS
   ========================================================= */

function setOMAStatus(text) {

    if (elements.omaStatus) {
        elements.omaStatus.textContent = text;
    }

}


function scrollBottom() {

    setTimeout(() => {

        if (elements.chatArea) {

            elements.chatArea.scrollTop =
                elements.chatArea.scrollHeight;

        }

    }, 50);

}


/* =========================================================
   THEME SYSTEM
   ========================================================= */

function getSavedTheme() {

    return (
        localStorage.getItem("omaTheme") ||
        "system"
    );

}


function getSystemTheme() {

    if (
        window.matchMedia &&
        window.matchMedia(
            "(prefers-color-scheme: light)"
        ).matches
    ) {

        return "light";

    }

    return "dark";

}


function applyTheme(
    selectedTheme,
    save = true
) {

    const html =
        document.documentElement;

    const actualTheme =
        selectedTheme === "system"
            ? getSystemTheme()
            : selectedTheme;


    /*
       Smooth transition is handled by the
       CSS .theme-changing class.
    */

    html.classList.add("theme-changing");


    html.setAttribute(
        "data-theme",
        actualTheme
    );


    html.setAttribute(
        "data-theme-preference",
        selectedTheme
    );


    if (save) {

        localStorage.setItem(
            "omaTheme",
            selectedTheme
        );

    }


    if (elements.appearanceSelect) {

        elements.appearanceSelect.value =
            selectedTheme;

    }


    window.setTimeout(() => {

        html.classList.remove(
            "theme-changing"
        );

    }, 350);


    console.log(
        "OMA theme:",
        selectedTheme,
        "=>",
        actualTheme
    );

}


function initializeTheme() {

    const savedTheme =
        getSavedTheme();


    applyTheme(
        savedTheme,
        false
    );


    /* Appearance selector */

    if (elements.appearanceSelect) {

        elements.appearanceSelect.addEventListener(
            "change",
            () => {

                const selectedTheme =
                    elements.appearanceSelect.value;


                applyTheme(
                    selectedTheme,
                    true
                );


                setOMAStatus(
                    `Theme changed to ${selectedTheme}`
                );

            }
        );

    }


    /* System theme changes */

    if (window.matchMedia) {

        const mediaQuery =
            window.matchMedia(
                "(prefers-color-scheme: light)"
            );


        const handleSystemThemeChange =
            () => {

                const preference =
                    localStorage.getItem(
                        "omaTheme"
                    );


                if (
                    preference === "system"
                ) {

                    applyTheme(
                        "system",
                        false
                    );

                }

            };


        if (
            mediaQuery.addEventListener
        ) {

            mediaQuery.addEventListener(
                "change",
                handleSystemThemeChange
            );

        }

        else if (
            mediaQuery.addListener
        ) {

            mediaQuery.addListener(
                handleSystemThemeChange
            );

        }

    }

}


/* =========================================================
   BACKEND HEALTH CHECK
   ========================================================= */

async function checkBackend() {

    console.log(
        "OMA: Starting backend health check..."
    );


    if (elements.statusText) {
        elements.statusText.textContent =
            "Checking...";
    }


    if (elements.statusDot) {

        elements.statusDot.classList.remove(
            "online"
        );

    }


    setOMAStatus(
        "Checking OMA cloud..."
    );


    const controller =
        new AbortController();


    const timeout =
        setTimeout(
            () => controller.abort(),
            15000
        );


    try {

        const response =
            await fetch(
                OMA_HEALTH_ENDPOINT,
                {
                    method: "GET",
                    cache: "no-store",
                    signal: controller.signal
                }
            );


        clearTimeout(timeout);


        if (!response.ok) {

            throw new Error(
                `Health check HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if (
            data &&
            data.status === "healthy"
        ) {

            if (elements.statusText) {

                elements.statusText.textContent =
                    "Online";

            }


            if (elements.statusDot) {

                elements.statusDot.classList.add(
                    "online"
                );

            }


            setOMAStatus(
                "OMA cloud connected"
            );


            console.log(
                "OMA CLOUD CONNECTION SUCCESSFUL"
            );

        }

        else {

            throw new Error(
                "Unexpected health response"
            );

        }

    }

    catch (error) {

        clearTimeout(timeout);


        console.error(
            "OMA: Backend health check failed:",
            error
        );


        if (elements.statusText) {

            elements.statusText.textContent =
                "Offline";

        }


        if (elements.statusDot) {

            elements.statusDot.classList.remove(
                "online"
            );

        }


        if (
            error.name === "AbortError"
        ) {

            setOMAStatus(
                "OMA cloud timeout"
            );

        }

        else {

            setOMAStatus(
                "OMA cloud unavailable"
            );

        }

    }

}

function loadHistory() {

    const saved =
        localStorage.getItem(
            "omaConversations"
        );


    if (saved) {

        try {

            const parsed =
                JSON.parse(saved);


            conversations =
                Array.isArray(parsed)
                    ? parsed
                    : [];

        }

        catch (error) {

            console.error(
                "OMA: Could not load history:",
                error
            );


            conversations = [];

        }

    }


    if (conversations.length > 0) {

        currentConversationId =
            conversations[0].id;

        renderConversation();

    }

    else {

        createNewChat();

    }


    renderHistory();

}


function saveHistory() {

    if (
        elements.saveHistorySetting &&
        !elements.saveHistorySetting.checked
    ) {

        return;

    }


    try {

        localStorage.setItem(
            "omaConversations",
            JSON.stringify(
                conversations
            )
        );

    }

    catch (error) {

        console.error(
            "OMA: Failed to save history:",
            error
        );

    }

}

/* =========================================================
   DATE / TIME FORMATTING
   ========================================================= */

function formatMessageTime(timestamp) {

    if (!timestamp) {
        return "";
    }


    const date =
        new Date(timestamp);


    if (isNaN(date.getTime())) {
        return "";
    }


    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


function formatMessageDate(timestamp) {

    if (!timestamp) {
        return "";
    }


    const date =
        new Date(timestamp);


    if (isNaN(date.getTime())) {
        return "";
    }


    const today =
        new Date();


    const yesterday =
        new Date();


    yesterday.setDate(
        yesterday.getDate() - 1
    );


    if (
        date.toDateString() ===
        today.toDateString()
    ) {

        return "Today";

    }


    if (
        date.toDateString() ===
        yesterday.toDateString()
    ) {

        return "Yesterday";

    }


    return date.toLocaleDateString(
        [],
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =========================================================

   ========================================================= */

function renderConversation() {

    if (!elements.messages) {
        return;

    const chat =
        getCurrentChat();


    elements.messages.innerHTML =
        "";


    if (
        !chat ||
        !Array.isArray(chat.messages) ||
        chat.messages.length === 0
    ) {

        showWelcome();

        return;

    }


    let lastMessageDate = "";


    chat.messages.forEach(message => {

        const messageDate =
            formatMessageDate(
                message.time
            );


        if (
            messageDate &&
            messageDate !== lastMessageDate
        ) {

            const separator =
                document.createElement("div");


            separator.className =
                "message-date-separator";


            separator.textContent =
                messageDate;


            elements.messages.appendChild(
                separator
            );


            lastMessageDate =
                messageDate;

        }


        renderMessage(message);

    });


    scrollBottom();

}

/* =========================================================
   ADD MESSAGE TO HISTORY
   ========================================================= */

function addMessage(
    sender,
    text,
    image = null
) {

    const chat =
        getCurrentChat();


    if (!chat) {
        return;
    }


    const message = {

        sender,
        text,
        image,
        time:
            new Date().toISOString()

    };


    chat.messages.push(message);


    chat.updatedAt =
        message.time;


    /*
       Automatically create a useful title
       from the user's first message.
    */

    if (
        sender === "user" &&
        chat.title === "New Chat" &&
        text
    ) {

        chat.title =
            text.length > 35
                ? text.substring(0, 35) + "..."
                : text;

    }


    saveHistory();
    renderHistory();
    renderMessage(message);

    scrollBottom();

}

/* =========================================================
   COPY BUTTON
   ========================================================= */

function createCopyButton(text) {

    const actions =
        document.createElement("div");


    actions.className =
        "message-actions";


    const button =
        document.createElement("button");


    button.className =
        "message-action-button";


    button.type =
        "button";


    button.title =
        "Copy response";


    button.setAttribute(
        "aria-label",
        "Copy response"
    );


    button.innerHTML =
        '<i class="bi bi-copy"></i>';


    button.addEventListener(
        "click",
        async () => {

            const success =
                await copyText(text);


            if (success) {

                button.innerHTML =
                    '<i class="bi bi-check-lg"></i>';


                button.title =
                    "Copied!";


                button.classList.add(
                    "copied"
                );


                setTimeout(
                    () => {

                        button.innerHTML =
                            '<i class="bi bi-copy"></i>';

                        button.title =
                            "Copy response";

                        button.classList.remove(
                            "copied"
                        );

                    },
                    1500
                );

            }

        }
    );


    actions.appendChild(button);

    return actions;

}


async function copyText(text) {

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );

            return true;

        }


        throw new Error(
            "Clipboard API unavailable"
        );

    }

    catch (error) {

        console.warn(
            "OMA: Using clipboard fallback"
        );


        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();
        textarea.select();


        let success = false;


        try {

            success =
                document.execCommand(
                    "copy"
                );

        }

        catch (fallbackError) {

            console.error(
                "OMA: Copy fallback failed:",
                fallbackError
            );

        }


        textarea.remove();


        return success;

    }

}

function showThinkingMessage() {

    removeThinkingMessage();


    thinkingCopyIndex =
        Math.floor(
            Math.random() *
            thinkingCopies.length
        );


    const wrapper =
        document.createElement("div");


    wrapper.id =
        "thinkingMessage";


    wrapper.className =
        "thinking-message";


    wrapper.innerHTML = `

        <div class="thinking-avatar thinking-pulse">

            <i class="bi bi-stars"></i>

        </div>

        <div class="thinking-body">

            <div class="thinking-name">
                OMA
            </div>

            <div class="thinking-box">

                <span
                    id="thinkingCopy"
                    class="thinking-copy"
                >
                    ${thinkingCopies[thinkingCopyIndex]}
                </span>

                <span class="thinking-dots">

                    <span class="thinking-dot"></span>
                    <span class="thinking-dot"></span>
                    <span class="thinking-dot"></span>

                </span>

            </div>

        </div>

    `;


    elements.messages?.appendChild(
        wrapper
    );


    scrollBottom();


    thinkingInterval =
        setInterval(
            () => {

                const copy =
                    document.getElementById(
                        "thinkingCopy"
                    );


                if (!copy) {
                    return;
                }


                thinkingCopyIndex =
                    (
                        thinkingCopyIndex + 1
                    ) %
                    thinkingCopies.length;


                copy.classList.add(
                    "changing"
                );


                setTimeout(
                    () => {

                        copy.textContent =
                            thinkingCopies[
                                thinkingCopyIndex
                            ];


                        copy.classList.remove(
                            "changing"
                        );

                    },
                    180
                );

            },
            2200
        );

}


function removeThinkingMessage() {

    if (thinkingInterval) {

        clearInterval(
            thinkingInterval
        );


        thinkingInterval =
            null;

    }


    document.getElementById(
        "thinkingMessage"
    )?.remove();

}


/* =========================================================
   SEND MESSAGE
   ========================================================= */

function sendMessage() {

    if (
        elements.sendButton?.disabled
    ) {

        return;

    }


    const text =
        elements.messageInput?.value
            .trim() || "";


    if (
        !text &&
        !selectedImage
    ) {

        return;

    }


    if (selectedImage) {

        const reader =
            new FileReader();


        reader.onload =
            event => {

                finishSending(
                    text,
                    event.target.result
                );

            };


        reader.onerror =
            error => {

                console.error(
                    "OMA: Image read error:",
                    error
                );


                setOMAStatus(
                    "Could not read image"
                );

            };


        reader.readAsDataURL(
            selectedImage
        );

    }

    else {

        finishSending(
            text,
            null
        );

    }

}


/* =========================================================
   CLOUD CHAT
   ========================================================= */

async function finishSending(
    text,
    image
) {

    console.log(
        "OMA: Sending message..."
    );


    addMessage(
        "user",
        text || "Image",
        image
    );


    if (elements.messageInput) {

        elements.messageInput.value =
            "";


        elements.messageInput.style.height =
            "auto";

    }


    clearImage();


    setOMAStatus(
        "OMA is thinking..."
    );


    if (elements.sendButton) {

        elements.sendButton.disabled =
            true;

    }


    showThinkingMessage();


    try {

        /*
           IMPORTANT:
           The current backend accepts the text
           message. The image is still stored in
           the conversation UI, but is not yet sent
           to the backend because your current
           /chat endpoint expects JSON text.
        */

        const requestBody = {

            message:
                text ||
                "Please analyze this image."

        };


        const response =
            await fetch(
                OMA_CHAT_ENDPOINT,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )

                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP error: ${response.status}`
            );

        }


        const data =
            await response.json();


        const omaReply =
            data.response ||
            data.message ||
            data.reply ||
            data.answer;


        if (!omaReply) {

            throw new Error(
                "Backend returned no response text."
            );

        }


        removeThinkingMessage();


        addMessage(
            "oma",
            omaReply
        );


        setOMAStatus(
            "OMA is ready"
        );


        console.log(
            "OMA: Message successfully received."
        );

    }

    catch (error) {

        console.error(
            "OMA: Chat backend error:",
            error
        );


        removeThinkingMessage();


        addMessage(
            "oma",
            "I couldn't reach the OMA cloud backend right now."
        );


        setOMAStatus(
            "Backend connection error"
        );

    }

    finally {

        if (elements.sendButton) {

            elements.sendButton.disabled =
                false;

        }

    }

}

/* =========================================================
   HISTORY RENDERING
   ========================================================= */

function renderHistory() {

    if (!elements.historyList) {
        return;
    }


    elements.historyList.innerHTML =
        "";


    const search =
        elements.historySearch
            ?.value
            .toLowerCase()
            .trim() || "";


    const filtered =
        conversations
            .filter(chat =>
                (chat.title || "New Chat")
                    .toLowerCase()
                    .includes(search)
            )
            .sort(
                (a, b) =>
                    new Date(b.updatedAt) -
                    new Date(a.updatedAt)
            );


    filtered.forEach(
        chat => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "history-item";


            if (
                chat.id ===
                currentConversationId
            ) {

                item.classList.add(
                    "active"
                );

            }


            const icon =
                document.createElement(
                    "i"
                );


            icon.className =
                "bi bi-chat-left-text";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "history-item-title";


            title.textContent =
                chat.title ||
                "New Chat";


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "history-actions";


            const rename =
                createHistoryAction(
                    "bi-pencil",
                    "Rename",
                    () =>
                        renameChat(chat.id)
                );


            const deleteButton =
                createHistoryAction(
                    "bi-trash",
                    "Delete",
                    () =>
                        deleteChat(chat.id)
                );


            actions.appendChild(rename);
            actions.appendChild(deleteButton);


            item.appendChild(icon);
            item.appendChild(title);
            item.appendChild(actions);


            item.addEventListener(
                "click",
                () =>
                    openConversation(chat.id)
            );


            elements.historyList.appendChild(
                item
            );

        }
    );

}


function createHistoryAction(
    iconName,
    title,
    action
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "history-action";


    button.type =
        "button";


    button.title =
        title;


    button.innerHTML =
        `<i class="bi ${iconName}"></i>`;


    button.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            action();

        }
    );


    return button;

}


/* =========================================================
   DELETE CHAT
   ========================================================= */

function deleteChat(id) {

    if (
        !confirm(
            "Delete this conversation?"
        )
    ) {

        return;

    }


    conversations =
        conversations.filter(
            chat =>
                chat.id !== id
        );


    if (
        currentConversationId === id
    ) {

        if (conversations.length > 0) {

            currentConversationId =
                conversations[0].id;

        }

        else {

            createNewChat();
            return;

        }

    }


    saveHistory();
    renderConversation();
    renderHistory();

}


/* =========================================================
   RENAME CHAT
   ========================================================= */

function renameChat(id) {

    conversationBeingRenamed =
        id;


    const chat =
        conversations.find(
            item =>
                item.id === id
        );


    if (!chat) {
        return;
    }


    const input =
        document.getElementById(
            "renameInput"
        );


    if (input) {

        input.value =
            chat.title || "";

    }


    const modalElement =
        document.getElementById(
            "renameModal"
        );


    if (!modalElement) {
        return;
    }


    const modal =
        bootstrap.Modal.getOrCreateInstance(
            modalElement
        );


    modal.show();

}


function saveRename() {

    const chat =
        conversations.find(
            item =>
                item.id ===
                conversationBeingRenamed
        );


    if (!chat) {
        return;
    }


    const input =
        document.getElementById(
            "renameInput"
        );


    const newName =
        input?.value.trim() || "";


    if (newName) {

        chat.title =
            newName;


        chat.updatedAt =
            new Date().toISOString();

    }


    saveHistory();
    renderHistory();


    const modalElement =
        document.getElementById(
            "renameModal"
        );


    if (modalElement) {

        const modal =
            bootstrap.Modal.getInstance(
                modalElement
            );


        modal?.hide();

    }


    conversationBeingRenamed =
        null;

}

    if (!input) {
        return;
    }


    const time =
        input.value;


    if (!time) {

        alert(
            "Please select a time."
        );

        return;

    }


    if (alarmInterval) {

        clearInterval(
            alarmInterval
        );

    }


    alarmInterval =
        setInterval(
            () => {

                const now =
                    new Date();


                const current =
                    now
                        .toTimeString()
                        .slice(0, 5);


                if (current === time) {

                    clearInterval(
                        alarmInterval
                    );


                    alarmInterval =
                        null;


                    setOMAStatus(
                        "Alarm ringing"
                    );


                    alert(
                        `OMA Alarm: ${time}`
                    );

                }

            },
            1000
        );


    setOMAStatus(
        `Alarm set for ${time}`
    );


    alert(
        `Alarm set for ${time}`
    );


    const modalElement =
        document.getElementById(
            "alarmModal"
        );


    if (modalElement) {

        bootstrap.Modal
            .getInstance(modalElement)
            ?.hide();

    }

}


/* =========================================================
   TIMER
   ========================================================= */

function openTimer() {

    const modalElement =
        document.getElementById(
            "timerModal"
        );


    if (!modalElement) {
        return;
    }


    bootstrap.Modal
        .getOrCreateInstance(
            modalElement
        )
        .show();

}


function saveTimer() {

    const minutesInput =
        document.getElementById(
            "timerMinutes"
        );


    const secondsInput =
        document.getElementById(
            "timerSeconds"
        );


    if (
        !minutesInput ||
        !secondsInput
    ) {

        return;

    }


    const minutes =
        Number(
            minutesInput.value
        );


    const seconds =
        Number(
            secondsInput.value
        );


    if (
        minutes < 0 ||
        seconds < 0 ||
        seconds > 59
    ) {

        alert(
            "Please enter a valid timer."
        );

        return;

    }


    let totalSeconds =
        minutes * 60 +
        seconds;


    if (totalSeconds <= 0) {

        alert(
            "Please enter a valid timer."
        );

        return;

    }


    const modalElement =
        document.getElementById(
            "timerModal"
        );


    if (modalElement) {

        bootstrap.Modal
            .getInstance(modalElement)
            ?.hide();

    }


    if (timerInterval) {

        clearInterval(
            timerInterval
        );

    }


    setOMAStatus(
        "Timer running..."
    );


    updateTimerStatus(
        totalSeconds
    );


    timerInterval =
        setInterval(
            () => {

                totalSeconds--;


                if (totalSeconds <= 0) {

                    clearInterval(
                        timerInterval
                    );


                    timerInterval =
                        null;


                    setOMAStatus(
                        "Timer finished"
                    );


                    alert(
                        "OMA Timer finished!"
                    );


                    return;

                }


                updateTimerStatus(
                    totalSeconds
                );

            },
            1000
        );

}


function updateTimerStatus(
    totalSeconds
) {

    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    setOMAStatus(
        `Timer: ${minutes}:${String(seconds).padStart(2, "0")}`
    );

}


/* =========================================================
   MICROPHONE / SPEECH RECOGNITION
   ========================================================= */

function setupMicrophone() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        if (elements.micButton) {

            elements.micButton.addEventListener(
                "click",
                () => {

                    alert(
                        "Voice input is not supported by this browser."
                    );

                }
            );

        }


        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.onstart =
        () => {

            isListening =
                true;


            setOMAStatus(
                "Listening..."
            );


            elements.micButton?.classList.add(
                "listening"
            );


            if (elements.micButton) {

                elements.micButton.innerHTML =
                    '<i class="bi bi-mic-fill"></i>';

            }

        };


    recognition.onresult =
        event => {

            const transcript =
                event.results[0][0]
                    .transcript;


            if (elements.messageInput) {

                elements.messageInput.value =
                    transcript;


                elements.messageInput.dispatchEvent(
                    new Event("input")
                );

            }


            setOMAStatus(
                "Voice captured"
            );

        };


    recognition.onerror =
        event => {

            console.error(
                "OMA: Microphone error:",
                event.error
            );


            setOMAStatus(
                "Microphone error"
            );

        };


    recognition.onend =
        () => {

            isListening =
                false;


            elements.micButton?.classList.remove(
                "listening"
            );


            if (elements.micButton) {

                elements.micButton.innerHTML =
                    '<i class="bi bi-mic"></i>';

            }

        };


    elements.micButton?.addEventListener(
        "click",
        () => {

            if (isListening) {

                recognition.stop();

                return;

            }


            try {

                recognition.start();

            }

            catch (error) {

                console.error(
                    "OMA: Could not start microphone:",
                    error
                );

            }

        }
    );

}


/* =========================================================
   TEXTAREA
   ========================================================= */

function autoResizeTextarea() {

    const textarea =
        elements.messageInput;


    if (!textarea) {
        return;
    }


    textarea.style.height =
        "auto";


    textarea.style.height =
        Math.min(
            textarea.scrollHeight,
            130
        ) + "px";

}


/* =========================================================
   EVENT LISTENERS
   ========================================================= */

function setupEventListeners() {

    /* New chat */

    elements.newChatButton?.addEventListener(
        "click",
        createNewChat
    );


    /* History search */

    elements.historySearch?.addEventListener(
        "input",
        renderHistory
    );


    /* Sidebar */

    elements.openSidebarButton?.addEventListener(
        "click",
        openSidebar
    );


    elements.closeSidebarButton?.addEventListener(
        "click",
        closeSidebar
    );


    elements.sidebarOverlay?.addEventListener(
        "click",
        closeSidebar
    );


    /* Rename */

    elements.saveRenameButton?.addEventListener(
        "click",
        saveRename
    );


    /* Image upload */

    elements.imageUpload?.addEventListener(
        "change",
        handleImageUpload
    );


    /* Textarea */

    elements.messageInput?.addEventListener(
        "input",
        autoResizeTextarea
    );


    /* Enter to send */

    elements.messageInput?.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* Send */

    elements.sendButton?.addEventListener(
        "click",
        sendMessage
    );

}


/* =========================================================
   START OMA
   ========================================================= */

function initializeOMA() {

    console.log(
        "OMA: ABOUT TO START"
    );


    /*
       Theme first.
       This prevents the page from briefly
       using the wrong theme.
    */

    initializeTheme();


    loadHistory();


    checkBackend();


    setupMicrophone();


    setupEventListeners();


    console.log(
        "======================================"
    );


    console.log(
        "OMA INITIALIZATION COMPLETE"
    );


    console.log(
        "======================================"
    );

}


/* =========================================================
   START
   ========================================================= */

initializeOMA();
